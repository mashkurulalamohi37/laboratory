name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nirnoy
          POSTGRES_PASSWORD: nirnoy
          POSTGRES_DB: nirnoy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nirnoy" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://nirnoy:nirnoy@localhost:5432/nirnoy_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Module boundaries
        run: lint-imports
      - name: Unit + integration tests
        run: pytest -q --junitxml=junit.xml
      - name: Migrations match models (no drift)
        env:
          DATABASE_URL: postgresql+asyncpg://nirnoy:nirnoy@localhost:5432/nirnoy_test
          JWT_SECRET: ci-only-secret-with-enough-length-0123456789
          OTP_HMAC_SECRET: ci-only-secret-with-enough-length-0123456789
        run: alembic upgrade head && alembic check

  contract:
    name: API contract · OpenAPI and generated client in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pip install -e services/api
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:openapi && pnpm api:types
      - name: Fail if the committed contract is stale
        run: git diff --exit-code packages/api-client/

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E · Playwright against the docker stack
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile fullstack up -d --build --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nirnoy/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @nirnoy/e2e e2e
      - name: Collect logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-debug
          path: |
            e2e/playwright-report
            compose.log

  images:
    name: Docker build + image scan
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: services/api, file: services/api/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
          - { name: console, context: ., file: apps/console/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: runtime
          tags: nirnoy/${{ matrix.name }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nirnoy/${{ matrix.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Python dependency audit
        run: pip install pip-audit && pip-audit --strict ./services/api
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: JS dependency audit
        run: pnpm audit --prod --audit-level high

  deploy-staging:
    name: Deploy · staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: [backend, contract, frontend, e2e, images, security]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: ./scripts/deploy.sh staging "${{ github.sha }}"
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
